{% extends 'base.html' %}
{% set nav = 'filter' %}
{% block title %}Filter · {{ exam.title }}{% endblock %}
{% block head %}<script src="{{ root }}/static/focus.js" defer></script>
<script src="{{ root }}/static/filter.js" defer></script>{% endblock %}
{% block body %}
<main class="narrow" id="filter">
<h1>Filter</h1>
<div class="bar">
<a id="fx-count" href="{{ root }}/" title="open the grid on these submissions">… submissions</a>
<button type="button" data-action="clear-filter">clear</button>
<a id="fx-link" href="" title="this filter as a link, to share">link</a>
<span class="grow"></span>
<span id="fx-msg" class="dim" role="status">loading…</span>
</div>
<div id="fx-questions"></div>
</main>
{% endblock %}
