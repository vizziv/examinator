<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="root" content="{{ root }}">
<title>scan</title>
<script src="{{ root }}/static/theme.js"></script>
<link rel="stylesheet" href="{{ root }}/static/app.css">
<script src="{{ root }}/static/scan.js" defer></script>
</head>
<body class="scanwin">
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false"><defs>
<!-- Apply gamma in display RGB before CSS inversion: gray x becomes 1 - x^2 -->
<filter id="image-gamma" color-interpolation-filters="sRGB"><feComponentTransfer>
<feFuncR type="gamma" amplitude="1" exponent="2" offset="0"/><feFuncG type="gamma" amplitude="1" exponent="2" offset="0"/><feFuncB type="gamma" amplitude="1" exponent="2" offset="0"/>
</feComponentTransfer></filter></defs></svg>
<nav class="top"><b id="who"></b> <span id="what" class="dim"></span><span class="grow"></span>
<label><input type="checkbox" id="all"> all pages</label></nav>
<div id="pages"><p class="dim">follows the question page</p></div>
</body>
</html>
