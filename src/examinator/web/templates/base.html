<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="{{ token }}">
<meta name="root" content="{{ root }}">
<title>{% block title %}{{ exam.title }}{% endblock %}</title>
<script src="{{ root }}/static/theme.js"></script>
<link rel="stylesheet" href="{{ root }}/static/app.css">
<script src="{{ root }}/static/common.js" defer></script>
<script src="{{ root }}/static/actions.js" defer></script>
<script src="{{ root }}/static/focus.js" defer></script>
{% block head %}{% endblock %}
</head>
<body class="p-{{ nav or 'other' }}">
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false"><defs>
<!-- Apply gamma in display RGB before CSS inversion: gray x becomes 1 - x^2 -->
<filter id="image-gamma" color-interpolation-filters="sRGB"><feComponentTransfer>
<feFuncR type="gamma" amplitude="1" exponent="2" offset="0"/><feFuncG type="gamma" amplitude="1" exponent="2" offset="0"/><feFuncB type="gamma" amplitude="1" exponent="2" offset="0"/>
</feComponentTransfer></filter></defs></svg>
<nav class="top">
<a href="{{ root }}/" id="home">{{ exam.title }}</a>
{% block nav %}{% endblock %}
<span class="grow"></span>
<span id="flash" role="status"></span>
{% if not model %}<span class="tag" title="nothing is read without a model">no model</span>{% endif %}
<a class="nav" href="{{ root }}/scans" title="scans in: split stacks into submissions"{% if nav == 'scans' %} aria-current="page"{% endif %}>Scans</a>
{% if nav != 'grid' %}<a class="nav" href="{{ root }}/filter" title="the filter: narrow by grade, state, answers…"{% if nav == 'filter' %} aria-current="page"{% endif %}>Filter</a>{% endif %}
<a class="nav" href="{{ root }}/runs"{% if nav == 'runs' %} aria-current="page"{% endif %}>Read</a>
<a class="nav" href="{{ root }}/exam" title="exam data: regions, keys, prompts"{% if nav == 'exam' %} aria-current="page"{% endif %}>Exam</a>
<a class="nav" href="{{ root }}/settings"{% if nav == 'settings' %} aria-current="page"{% endif %}>Settings</a>
</nav>
{% block body %}{% endblock %}
</body>
</html>
